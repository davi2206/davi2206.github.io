name: Content Checks

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

jobs:
  content:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check placeholders
        run: node .github/scripts/check-placeholders.js

      - name: Check front matter
        run: node .github/scripts/check-frontmatter.js

      - name: Check image references
        run: node .github/scripts/check-images.js

      - name: Markdown lint
        run: npx markdownlint-cli2 "**/*.md"